name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend and development dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Run backend tests
        run: python -m pytest backend/tests

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install backend and development dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Lint backend
        run: python -m ruff check backend
      - name: Check backend formatting
        run: python -m ruff format --check backend
      - name: Compile Python sources
        run: python -m compileall backend/app backend/tests
      - name: Validate backend dependency graph
        run: python backend/scripts/generate_dependency_graph.py --check

  frontend:
    name: Frontend and demo corpus
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify baseline browser OCR models
        run: |
          npm run ocr:verify
          git diff --exit-code -- frontend/assets/tessdata/manifest.json
      - name: Verify demo corpus
        run: npm run samples:verify
      - name: Run frontend tests
        run: npm test

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - backend-tests
      - backend-quality
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to succeed
        env:
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
          BACKEND_QUALITY_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$BACKEND_TESTS_RESULT" = "success"
          test "$BACKEND_QUALITY_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"

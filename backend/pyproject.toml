[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-scan-backend"
version = "0.1.0"
description = "FastAPI backend for Visual Scan"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<1.0",
  "pillow>=12.0,<13.0",
  "pydantic-settings>=2.14,<3.0",
  "pypdfium2>=5.12.1,<6.0",
  "pytesseract>=0.3.13,<1.0",
  "python-multipart>=0.0.22,<1.0",
  "uvicorn>=0.51,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.1,<10.0",
  "ruff>=0.15,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
